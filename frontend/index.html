<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Transit Hub</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f1ea; color: #1b2433; }
  header { background: #101828; color: #f4f1ea; padding: 20px 24px; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 4px 0 0; color: #c9d1dc; font-size: 14px; }
  main { max-width: 760px; margin: 0 auto; padding: 24px; }
  .row { display: flex; align-items: center; gap: 16px; background: #fdfcf8;
         border: 1px solid #ddd6c4; border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; }
  .badge { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center;
           justify-content: center; font-weight: 700; color: #fff; flex: none; }
  .info { flex: 1; }
  .status { font-weight: 600; }
  .alert .status { color: #b45309; }
  .msg { font-size: 14px; color: #3f4a5c; margin-top: 2px; }
  #updated, #error { font-size: 14px; color: #6b7280; margin-bottom: 16px; }
  #error { color: #b91c1c; }
</style>
</head>
<body>
<header>
  <h1>NYC Transit Hub</h1>
  <p>Live subway service status</p>
</header>
<main>
  <div id="updated">Loading…</div>
  <div id="error"></div>
  <div id="lines"></div>
</main>
<script>
  // Conventional subway line colors by group.
  const COLORS = {
    "1": "#d82233", "2": "#d82233", "3": "#d82233",
    "4": "#009952", "5": "#009952", "6": "#009952",
    "7": "#9a38a1",
    "A": "#0062cf", "C": "#0062cf", "E": "#0062cf",
    "B": "#eb6800", "D": "#eb6800", "F": "#eb6800", "M": "#eb6800",
    "G": "#799534",
    "J": "#8e5c33", "Z": "#8e5c33",
    "L": "#7c858c", "S": "#7c858c",
    "N": "#f6bc26", "Q": "#f6bc26", "R": "#f6bc26", "W": "#f6bc26"
  };
  const DARK_TEXT = new Set(["N", "Q", "R", "W"]);

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  async function load() {
    const errorEl = document.getElementById("error");
    try {
      const res = await fetch("/status");
      if (!res.ok) throw new Error("Server returned " + res.status);
      const lines = await res.json();
      document.getElementById("lines").innerHTML = lines.map(l => `
        <div class="row ${l.status === "Good Service" ? "" : "alert"}">
          <div class="badge" style="background:${COLORS[l.line] || "#555"};color:${DARK_TEXT.has(l.line) ? "#101828" : "#fff"}">${esc(l.line)}</div>
          <div class="info">
            <div class="status">${esc(l.status)}</div>
            ${l.message ? `<div class="msg">${esc(l.message)}</div>` : ""}
          </div>
        </div>`).join("");
      document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString();
      errorEl.textContent = "";
    } catch (err) {
      errorEl.textContent = "Could not load status: " + err.message;
    }
  }
  load();
  setInterval(load, 30000);
</script>
</body>
</html>
